name: Verify Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install Jekyll and plugins
        run: gem install jekyll jekyll-feed jekyll-paginate jekyll-sitemap jekyll-redirect-from jemoji

      - name: Build site
        run: |
          [ -f Gemfile ] && mv Gemfile /tmp/Gemfile
          [ -f Gemfile.lock ] && mv Gemfile.lock /tmp/Gemfile.lock
          jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
